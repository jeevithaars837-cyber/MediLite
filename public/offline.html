<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CareSync - Offline</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #082849;
      color: #f0f7ff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 1.5rem;
      text-align: center;
    }
    .card {
      background-color: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 2rem;
      max-width: 400px;
    }
    h1 { margin-top: 0; color: #36a8f8; font-size: 1.5rem; }
    p { color: #bae0fd; line-height: 1.5; font-size: 0.95rem; }
    button {
      margin-top: 1rem;
      background: #0c8ce9;
      color: white;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>CareSync Offline</h1>
    <p>You are currently offline. Your saved consultations and health records remain accessible on this device.</p>
    <button onclick="window.location.reload()">Retry Connection</button>
  </div>
</body>
</html>
